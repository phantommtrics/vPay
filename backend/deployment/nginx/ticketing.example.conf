# Ticketing — PHP on aps-ticketing.apswallet.gm (nginx + php-fpm)
#
# App files: /var/www/ticketing/index.php
# URL prefix: /ticketing/
#
# Uses root /var/www (not alias) — most reliable with Ubuntu fastcgi-php snippet.
#
# Install php-fpm (Apache used mod_php — nginx needs php-fpm separately):
#   sudo apt install php-fpm php-cli php-mysql php-xml php-mbstring php-curl
#   ls /run/php/*.sock          ← use THIS path in fastcgi_pass below
#   sudo systemctl enable --now php8.1-fpm   # or whatever version apt installs
#
# HTTPS (required — without it Cloudflare gets wrong site or 502):
#   sudo certbot --nginx -d aps-ticketing.apswallet.gm

server {
    listen 80;
    listen [::]:80;
    server_name aps-ticketing.apswallet.gm;

    root /var/www;
    index index.php;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location = / {
        return 301 /ticketing/;
    }

    # Static assets — HTML links to /public/... (domain root)
    # Use root (not alias) so MIME types (application/javascript) resolve correctly.
    location /public/ {
        root /var/www/ticketing;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    # Static files under /ticketing/ path (avoid sending .js to PHP)
    location ~* ^/ticketing/.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        root /var/www;
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location /ticketing/ {
        try_files $uri $uri/ /ticketing/index.php?$query_string;
    }

    location ~ ^/ticketing/.+\.php$ {
        include snippets/fastcgi-php.conf;
        # MUST match an existing socket — run: ls /run/php/*.sock
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    location / {
        return 404;
    }
}

# 502 troubleshooting (run on server):
#   sudo systemctl status php8.2-fpm
#   sudo tail -30 /var/log/nginx/error.log
#   ls -la /var/www/ticketing/index.php
#   sudo -u www-data test -r /var/www/ticketing/index.php && echo OK || echo PERMISSION DENIED
#
# Wrong PHP version? Install php-fpm and match fastcgi_pass to ls /run/php/*.sock:
#   sudo apt install php-fpm php-mysql php-xml php-mbstring php-curl
#   sudo systemctl enable --now php8.1-fpm
