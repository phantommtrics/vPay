# Consumer web app on customer.vpayafrica.phantommetrics.gm
#
# Static Expo web export. The API stays on api.vpayafrica.phantommetrics.gm.
# Build: bash backend/deployment/deploy-customer-web.sh
# Guide: backend/deployment/nginx/DEPLOY-CUSTOMER-WEB.md

server {
    listen 80;
    listen [::]:80;
    server_name customer.vpayafrica.phantommetrics.gm;

    root /var/www/vpay-customer;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Expo static export writes route HTML (onboarding.html, …). Unknown paths
    # fall back to the shell so client routing still works.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

# HTTPS: after this site answers on port 80, run:
#   sudo certbot --nginx -d customer.vpayafrica.phantommetrics.gm
