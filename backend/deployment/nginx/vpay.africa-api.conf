# vPay API + Admin portal on api.vpayafrica.phantommetrics.gm
#
# - /api/, /uploads/, /health  → Node backend (port 3001)
# - everything else            → appAdmin static build (/var/www/vpay-admin)
#
# Build admin: npm run admin:build  (from repo root)
# Deploy guide: backend/deployment/nginx/DEPLOY-ADMIN.md

server {
    listen 80;
    listen [::]:80;
    server_name api.vpayafrica.phantommetrics.gm;

    root /var/www/vpay-admin;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* ^/(sw\.js|workbox-.*\.js|registerSW\.js|push-handler\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS: after Certbot, copy the location blocks above into the 443 server block
# Certbot creates, or run:
#   sudo certbot --nginx -d api.vpayafrica.phantommetrics.gm
#
# If Certbot already configured HTTPS, merge these locations into that block
# (do not leave `location / { proxy_pass ... }` pointing everything at Node).
