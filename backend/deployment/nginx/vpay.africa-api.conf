# Nginx config for vpay-africa backend API (api.vpayafrica.phantommetrics.gm)
# Backend must be running on port 3001 (e.g. Node with PORT=3001).

# HTTP — redirect to HTTPS after Certbot (Certbot may add the redirect)
server {
    listen 80;
    listen [::]:80;
    server_name api.vpayafrica.phantommetrics.gm;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTPS — use this after running: sudo certbot --nginx -d api.vpayafrica.phantommetrics.gm
